<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>محادثة خاصة</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #d9e3e9;
      color: #17212b;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      position: relative;
      overflow: hidden;

      background: #dce7ee;
    }

    @media (min-width: 700px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content {
        width: min(1050px, 96vw);
        height: min(850px, 94vh);

        border-radius: 15px;

        box-shadow:
          0 15px 50px rgba(0, 0, 0, .20);

        overflow: hidden;
      }
    }

    /* =========================
       HEADER
    ========================= */

    .chat-header {
      height: 64px;
      min-height: 64px;

      display: flex;
      align-items: center;

      padding: 7px 10px;

      background: #ffffff;

      border-bottom: 1px solid #e5e9ec;

      box-shadow:
        0 1px 6px rgba(0, 0, 0, .08);

      z-index: 20;
    }

    .avatar {
      width: 46px;
      height: 46px;
      min-width: 46px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-left: 10px;

      font-size: 23px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #35b9ed,
          #168ac1
        );

      box-shadow:
        0 3px 8px rgba(34,158,217,.25);
    }

    .head-info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 12px;
      color: #83919b;

      margin-top: 2px;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .head-btn {
      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;

      cursor: pointer;

      transition: .15s;
    }

    .head-btn:hover {
      background: #f0f3f5;
    }

    .head-btn:active {
      transform: scale(.9);
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 18px 14px;

      display: flex;
      flex-direction: column;

      background-color: #dce7ee;

      background-image:
        radial-gradient(
          rgba(85,110,125,.12) 1px,
          transparent 1px
        );

      background-size: 25px 25px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(80,100,110,.25);
      border-radius: 20px;
    }

    /* =========================
       TELEGRAM CARTOON CENTER
    ========================= */

    .welcome {
      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;

      text-align: center;

      pointer-events: none;

      opacity: .92;
    }

    .welcome-art {
      width: 145px;
      height: 145px;

      border-radius: 42px;

      background:
        linear-gradient(
          145deg,
          #55c8f1,
          #229ed9
        );

      box-shadow:
        0 14px 35px
        rgba(34,158,217,.25);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      transform: rotate(-2deg);
    }

    .welcome-art::before {
      content: "";

      width: 76px;
      height: 58px;

      position: absolute;

      background: #fff;

      border-radius:
        20px
        20px
        20px
        7px;

      transform: rotate(-12deg);
    }

    .welcome-art::after {
      content: "➤";

      position: absolute;

      color: #229ed9;

      font-size: 38px;

      transform:
        rotate(-12deg)
        translate(-2px, -1px);
    }

    .welcome-title {
      margin-top: 15px;

      font-size: 18px;
      font-weight: 700;

      color: #526873;
    }

    .welcome-text {
      margin-top: 5px;

      font-size: 12px;

      color: #7b8b94;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;
      flex-direction: column;

      max-width: 78%;

      margin-bottom: 7px;

      animation:
        messageAppear .16s ease-out;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message--mine {
      align-items: flex-end;
      align-self: flex-start;
    }

    .message--theirs {
      align-items: flex-start;
      align-self: flex-end;
    }

    .message__name {
      padding:
        1px 8px 3px;

      font-size: 11px;
      font-weight: 600;

      color: #6e7f89;
    }

    .message__bubble {
      padding:
        9px 13px;

      border-radius: 12px;

      font-size: 15px;

      line-height: 1.5;

      word-break: break-word;
      overflow-wrap: anywhere;

      box-shadow:
        0 1px 2px rgba(0,0,0,.11);

      color: #17212b;

      background: #ffffff;
    }

    .message--theirs .message__bubble {
      border-top-right-radius: 3px;
      background: #ffffff;
    }

    .message--mine .message__bubble {
      border-top-left-radius: 3px;
      background: #effdde;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      min-height: 66px;

      display: flex;
      align-items: center;

      gap: 6px;

      padding:
        7px 9px;

      background: #ffffff;

      border-top:
        1px solid #e3e7ea;

      position: relative;

      z-index: 30;
    }

    /* =========================
       EMOJI
    ========================= */

    .emoji-button {
      width: 44px;
      height: 44px;

      min-width: 44px;

      border: 0;

      background: transparent;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;

      cursor: pointer;

      user-select: none;

      transition: .15s;
    }

    .emoji-button:hover {
      background: #f0f3f5;
    }

    .emoji-button:active {
      transform: scale(.9);
    }

    /* =========================
       INPUT
    ========================= */

    .input-wrap {
      flex: 1;

      min-width: 0;

      height: 44px;

      display: flex;
      align-items: center;

      padding:
        0 15px;

      background: #f1f3f5;

      border-radius: 23px;
    }

    input[type="text"] {
      width: 100%;
      height: 44px;

      border: 0;
      outline: 0;

      background: transparent;

      font-family: inherit;

      font-size: 15px;

      color: #17212b;
    }

    input[type="text"]::placeholder {
      color: #87959e;
    }

    .input-wrap:focus-within {
      box-shadow:
        inset 0 0 0 1px
        rgba(34,158,217,.2);
    }

    /* =========================
       SEND
    ========================= */

    .send-btn {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border: 0;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2aabee,
          #168ac1
        );

      color: white;

      font-size: 19px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 3px 9px
        rgba(34,158,217,.28);

      transition: .12s;
    }

    .send-btn:hover {
      box-shadow:
        0 5px 13px
        rgba(34,158,217,.38);
    }

    .send-btn:active {
      transform: scale(.91);
    }

    /* =========================
       EMOJI PANEL
    ========================= */

    .emoji-panel {
      position: absolute;

      bottom: 72px;
      right: 8px;

      width: 300px;

      max-width:
        calc(100vw - 16px);

      max-height: 260px;

      overflow-y: auto;

      padding: 10px;

      background: #ffffff;

      border-radius: 14px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.20);

      display: none;

      grid-template-columns:
        repeat(8,1fr);

      gap: 3px;

      z-index: 100;
    }

    .emoji-panel.show {
      display: grid;
    }

    .emoji-choice {
      border: 0;

      background: transparent;

      border-radius: 8px;

      padding: 5px;

      font-size: 22px;

      cursor: pointer;
    }

    .emoji-choice:hover {
      background: #eef2f4;
    }

    /* =========================
       SHARE MODAL
    ========================= */

    .modal {
      position: absolute;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.42);

      z-index: 200;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(420px,100%);

      padding: 21px;

      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.28);

      animation:
        modalIn .18s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 13px;

      line-height: 1.6;

      color: #71808a;

      margin-bottom: 12px;
    }

    .share-url {
      padding: 11px;

      background: #f1f3f5;

      border-radius: 10px;

      direction: ltr;

      text-align: left;

      word-break: break-all;

      font-size: 12px;
    }

    .modal-actions {
      display: flex;

      gap: 8px;

      margin-top: 15px;
    }

    .modal-actions button {
      flex: 1;

      padding: 11px;

      border-radius: 10px;

      cursor: pointer;
    }

    .copy-btn {
      background: #229ed9;
      color: white;
    }

    .close-btn {
      background: #e9eef1;
      color: #17212b;
    }

    /* =========================
       DARK MODE
    ========================= */

    .dark-mode {
      background: #0e171e;
      color: #edf4f7;
    }

    .dark-mode .chat-header,
    .dark-mode .footer {
      background: #17212b;
      border-color: rgba(255,255,255,.07);
    }

    .dark-mode .title {
      color: #edf4f7;
    }

    .dark-mode .status {
      color: #91a2ac;
    }

    .dark-mode .head-btn,
    .dark-mode .emoji-button {
      color: #edf4f7;
    }

    .dark-mode .head-btn:hover,
    .dark-mode .emoji-button:hover {
      background: rgba(255,255,255,.08);
    }

    .dark-mode .messages {
      background-color: #101a21;

      background-image:
        radial-gradient(
          rgba(180,210,220,.06) 1px,
          transparent 1px
        );
    }

    .dark-mode .message__name {
      color: #91a3ad;
    }

    .dark-mode .message--theirs .message__bubble {
      background: #26343d;
      color: #edf4f7;
    }

    .dark-mode .message--mine .message__bubble {
      background: #28543d;
      color: #edf4f7;
    }

    .dark-mode .input-wrap {
      background: #26343d;
    }

    .dark-mode input[type="text"] {
      color: #edf4f7;
    }

    .dark-mode .emoji-panel,
    .dark-mode .modal-box {
      background: #202b33;
      color: #edf4f7;
    }

    .dark-mode .emoji-choice:hover {
      background: rgba(255,255,255,.08);
    }

    .dark-mode .share-url {
      background: #26343d;
    }

    .dark-mode .close-btn {
      background: #2d3a43;
      color: #fff;
    }

    .dark-mode .welcome-title {
      color: #a8bbc5;
    }

    .dark-mode .welcome-text {
      color: #82949e;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .chat-header {
        height: 60px;
        min-height: 60px;
        padding: 6px 7px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        min-width: 42px;
      }

      .head-btn {
        width: 39px;
        height: 39px;
      }

      .messages {
        padding:
          10px 7px;
      }

      .message {
        max-width: 87%;
      }

      .message__bubble {
        font-size: 14px;
      }

      .footer {
        min-height: 61px;
        padding: 6px;
      }

      .emoji-button {
        width: 41px;
        height: 41px;
        min-width: 41px;
      }

      .send-btn {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }

      .welcome-art {
        width: 110px;
        height: 110px;
        border-radius: 32px;
      }

      .welcome-art::before {
        width: 60px;
        height: 46px;
      }

      .welcome-art::after {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="content">

    <!-- HEADER -->
    <header class="chat-header">

      <div class="avatar">
        💬
      </div>

      <div class="head-info">

        <div class="title">
          محادثة خاصة
        </div>

        <div class="status">
          محادثة مباشرة
        </div>

      </div>

      <div class="head-actions">

        <!-- مشاركة -->
        <button
          type="button"
          class="head-btn"
          id="shareButton"
          title="مشاركة المحادثة">
          🔗
        </button>

        <!-- الوضع الليلي -->
        <button
          type="button"
          class="head-btn"
          id="themeButton"
          title="الوضع الليلي">
          🌙
        </button>

      </div>

    </header>


    <!-- MESSAGES -->
    <div class="messages">

      <!-- الزينة الموجودة في وسط الشاشة -->
      <div class="welcome" id="welcome">

        <div class="welcome-art"></div>

        <div class="welcome-title">
          ابدأ محادثتك
        </div>

        <div class="welcome-text">
          محادثة خاصة وآمنة
        </div>

      </div>

    </div>


    <!-- FOOTER -->
    <form
      class="footer"
      onsubmit="return false;">

      <!-- Emoji -->
      <button
        type="button"
        class="emoji-button"
        id="emojiButton"
        title="الإيموجي">
        😊
      </button>


      <!-- Input -->
      <div class="input-wrap">

        <input
          type="text"
          placeholder="اكتب رسالة..."
          autocomplete="off">

      </div>


      <!-- Send -->
      <button
        type="submit"
        class="send-btn"
        title="إرسال">
        ➤
      </button>


      <!-- Emoji Panel -->
      <div
        class="emoji-panel"
        id="emojiPanel">

        <button type="button" class="emoji-choice">😀</button>
        <button type="button" class="emoji-choice">😃</button>
        <button type="button" class="emoji-choice">😄</button>
        <button type="button" class="emoji-choice">😁</button>

        <button type="button" class="emoji-choice">😂</button>
        <button type="button" class="emoji-choice">🤣</button>
        <button type="button" class="emoji-choice">😊</button>
        <button type="button" class="emoji-choice">😍</button>

        <button type="button" class="emoji-choice">🥰</button>
        <button type="button" class="emoji-choice">😘</button>
        <button type="button" class="emoji-choice">😎</button>
        <button type="button" class="emoji-choice">🤩</button>

        <button type="button" class="emoji-choice">🥳</button>
        <button type="button" class="emoji-choice">😇</button>
        <button type="button" class="emoji-choice">🤔</button>
        <button type="button" class="emoji-choice">😴</button>

        <button type="button" class="emoji-choice">😭</button>
        <button type="button" class="emoji-choice">😢</button>
        <button type="button" class="emoji-choice">😡</button>
        <button type="button" class="emoji-choice">😱</button>

        <button type="button" class="emoji-choice">❤️</button>
        <button type="button" class="emoji-choice">🧡</button>
        <button type="button" class="emoji-choice">💛</button>
        <button type="button" class="emoji-choice">💚</button>

        <button type="button" class="emoji-choice">💙</button>
        <button type="button" class="emoji-choice">💜</button>
        <button type="button" class="emoji-choice">🖤</button>
        <button type="button" class="emoji-choice">🤍</button>

        <button type="button" class="emoji-choice">👍</button>
        <button type="button" class="emoji-choice">👏</button>
        <button type="button" class="emoji-choice">🙏</button>
        <button type="button" class="emoji-choice">🔥</button>

        <button type="button" class="emoji-choice">💯</button>
        <button type="button" class="emoji-choice">✨</button>
        <button type="button" class="emoji-choice">🎉</button>
        <button type="button" class="emoji-choice">🙈</button>

      </div>

    </form>


    <!-- SHARE MODAL -->
    <div
      class="modal"
      id="shareModal">

      <div class="modal-box">

        <div class="modal-title">
          🔗 مشاركة المحادثة
        </div>

        <div class="modal-description">
          أرسل هذا الرابط للشخص الذي تريد التحدث معه.
          عند فتحه سيدخل إلى نفس غرفة المحادثة.
        </div>

        <div
          class="share-url"
          id="shareUrl">
        </div>

        <div class="modal-actions">

          <button
            type="button"
            class="copy-btn"
            id="copyShare">
            نسخ الرابط
          </button>

          <button
            type="button"
            class="close-btn"
            id="closeShare">
            إغلاق
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- TEMPLATE المطلوب من script.js -->
  <template data-template="message">

    <div class="message">

      <div class="message__name"></div>

      <div class="message__bubble"></div>

    </div>

  </template>


  <!-- السكربت الأصلي بدون أي تعديل -->
  <script src="script.js"></script>


  <!-- وظائف الواجهة فقط -->
  <script>

    const emojiButton =
      document.getElementById('emojiButton');

    const emojiPanel =
      document.getElementById('emojiPanel');

    const input =
      document.querySelector(
        'input[type="text"]'
      );

    const themeButton =
      document.getElementById('themeButton');

    const shareButton =
      document.getElementById('shareButton');

    const shareModal =
      document.getElementById('shareModal');

    const shareUrl =
      document.getElementById('shareUrl');

    const copyShare =
      document.getElementById('copyShare');

    const closeShare =
      document.getElementById('closeShare');

    const messages =
      document.querySelector('.messages');

    const welcome =
      document.getElementById('welcome');


    /* =================================
       EMOJI
    ================================= */

    let pressTimer = null;
    let longPress = false;

    emojiButton.addEventListener(
      'pointerdown',
      () => {

        longPress = false;

        pressTimer =
          setTimeout(() => {

            longPress = true;

            emojiPanel.classList.add(
              'show'
            );

          }, 500);

      }
    );


    emojiButton.addEventListener(
      'pointerup',
      () => {

        clearTimeout(pressTimer);

        if (!longPress) {

          input.value += '😊';

          input.focus();

        }

      }
    );


    emojiButton.addEventListener(
      'pointercancel',
      () => {

        clearTimeout(pressTimer);

      }
    );


    emojiButton.addEventListener(
      'pointerleave',
      () => {

        clearTimeout(pressTimer);

      }
    );


    document
      .querySelectorAll('.emoji-choice')
      .forEach(button => {

        button.addEventListener(
          'click',
          () => {

            input.value +=
              button.textContent;

            input.focus();

            emojiPanel.classList.remove(
              'show'
            );

          }
        );

      });


    /* =================================
       DARK / LIGHT
    ================================= */

    const savedTheme =
      localStorage.getItem(
        'chat-theme'
      );

    if (savedTheme === 'dark') {

      document.body.classList.add(
        'dark-mode'
      );

      themeButton.textContent =
        '☀️';

    }


    themeButton.addEventListener(
      'click',
      () => {

        const dark =
          document.body.classList.toggle(
            'dark-mode'
          );

        localStorage.setItem(
          'chat-theme',
          dark ? 'dark' : 'light'
        );

        themeButton.textContent =
          dark ? '☀️' : '🌙';

      }
    );


    /* =================================
       SHARE
    ================================= */

    shareButton.addEventListener(
      'click',
      () => {

        shareUrl.textContent =
          window.location.href;

        shareModal.classList.add(
          'show'
        );

      }
    );


    closeShare.addEventListener(
      'click',
      () => {

        shareModal.classList.remove(
          'show'
        );

      }
    );


    shareModal.addEventListener(
      'click',
      event => {

        if (
          event.target ===
          shareModal
        ) {

          shareModal.classList.remove(
            'show'
          );

        }

      }
    );


    copyShare.addEventListener(
      'click',
      async () => {

        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          copyShare.textContent =
            'تم النسخ ✓';

          setTimeout(() => {

            copyShare.textContent =
              'نسخ الرابط';

          }, 1500);

        } catch {

          window.prompt(
            'انسخ الرابط:',
            window.location.href
          );

        }

      }
    );


    /* =================================
       إغلاق Emoji عند الضغط خارجه
    ================================= */

    document.addEventListener(
      'pointerdown',
      event => {

        if (
          !emojiPanel.contains(
            event.target
          ) &&
          event.target !== emojiButton
        ) {

          emojiPanel.classList.remove(
            'show'
          );

        }

      }
    );


    /* =================================
       إخفاء الزينة عند ظهور رسالة
    ================================= */

    const observer =
      new MutationObserver(() => {

        const messageCount =
          messages.querySelectorAll(
            '.message'
          ).length;

        if (
          messageCount > 0 &&
          welcome &&
          welcome.parentNode
        ) {

          welcome.remove();

        }

      });


    observer.observe(
      messages,
      {
        childList: true
      }
    );

  </script>

</body>
</html>
