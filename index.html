<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>Chat</title>

  <!-- ScaleDrone — نفس الموجود في السكربت الأصلي -->
  <script
    type="text/javascript"
    src="https://cdn.scaledrone.com/scaledrone.min.js">
  </script>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #d7e1e8;

      overflow: hidden;

      color: #17212b;
    }


    /* =========================================
       APP
    ========================================= */

    .app {

      width: 100%;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================================
       CHAT
    ========================================= */

    .content {

      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      position: relative;

      overflow: hidden;

      background: #dce6ed;
    }


    @media (min-width: 700px) {

      .content {

        width: min(1000px, 100vw);

        height: min(850px, 100dvh);

        border-radius: 12px;

        box-shadow:
          0 10px 40px rgba(0,0,0,.18);
      }
    }


    /* =========================================
       HEADER
    ========================================= */

    .chat-header {

      height: 64px;
      min-height: 64px;

      display: flex;
      align-items: center;

      padding:
        7px 12px;

      background: #ffffff;

      border-bottom:
        1px solid #e5e9ec;

      box-shadow:
        0 1px 5px rgba(0,0,0,.08);

      z-index: 10;
    }


    /* زر الرجوع */

    .chat-header__back {

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      color: #229ed9;

      cursor: pointer;

      border-radius: 50%;

      transition: .15s;
    }

    .chat-header__back:hover {

      background: #edf5f9;
    }


    /* =========================================
       AVATAR
    ========================================= */

    .chat-header__avatar {

      width: 45px;
      height: 45px;

      flex-shrink: 0;

      margin-right: 4px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 22px;

      background:
        linear-gradient(
          135deg,
          #2aabee,
          #168ac1
        );

      box-shadow:
        0 2px 6px rgba(34,158,217,.25);
    }


    /* =========================================
       HEADER INFO
    ========================================= */

    .chat-header__info {

      flex: 1;

      min-width: 0;

      margin-right: 10px;
    }


    .chat-header__title {

      font-size: 16px;

      font-weight: 700;

      color: #17212b;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .chat-header__status {

      margin-top: 2px;

      font-size: 12px;

      color: #8a98a3;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================
       HEADER ACTIONS
    ========================================= */

    .chat-header__actions {

      display: flex;

      align-items: center;

      gap: 2px;
    }


    .header-action {

      width: 42px;
      height: 42px;

      border: 0;

      background: transparent;

      border-radius: 50%;

      font-size: 20px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: .15s;
    }


    .header-action:hover {

      background: #f0f3f5;
    }


    /* =========================================
       MESSAGES
    ========================================= */

    .messages {

      flex: 1;

      min-height: 0;

      width: 100%;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        15px 14px 12px;

      display: flex;

      flex-direction: column;

      background-color: #dce6ed;

      /*
        خلفية هادئة تشبه تطبيقات المحادثة
      */

      background-image:

        radial-gradient(
          rgba(100,120,135,.11) 1px,
          transparent 1px
        );

      background-size: 24px 24px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;
    }


    /* Scrollbar */

    .messages::-webkit-scrollbar {

      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {

      background: rgba(90,110,120,.25);

      border-radius: 20px;
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .message {

      display: flex;

      flex-direction: column;

      max-width: min(600px, 78%);

      margin-bottom: 7px;

      animation:
        messageAppear .16s ease-out;
    }


    @keyframes messageAppear {

      from {

        opacity: 0;

        transform:
          translateY(5px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* رسائلي */

    .message--mine {

      align-items: flex-end;

      align-self: flex-start;
    }


    /* رسائل الطرف الآخر */

    .message--theirs {

      align-items: flex-start;

      align-self: flex-end;
    }


    /* =========================================
       NAME
    ========================================= */

    .message__name {

      font-size: 11px;

      font-weight: 600;

      color: #6e7e88;

      padding:
        0 8px 3px;

      line-height: 1.3;
    }


    /* =========================================
       BUBBLE
    ========================================= */

    .message__bubble {

      padding:
        8px 12px;

      border-radius: 11px;

      font-size: 15px;

      line-height: 1.45;

      word-break: break-word;

      overflow-wrap: anywhere;

      color: #17212b;

      box-shadow:
        0 1px 2px rgba(0,0,0,.10);

      transition: .12s;
    }


    /* الطرف الآخر */

    .message--theirs
    .message__bubble {

      background: #ffffff;

      border-top-right-radius: 3px;
    }


    /* أنا */

    .message--mine
    .message__bubble {

      background: #effdde;

      border-top-left-radius: 3px;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {

      width: 100%;

      min-height: 64px;

      padding:
        7px 9px;

      display: flex;

      align-items: center;

      gap: 6px;

      background: #ffffff;

      border-top:
        1px solid #e3e7ea;

      flex-shrink: 0;

      position: relative;

      z-index: 20;

      padding-bottom:
        max(7px, env(safe-area-inset-bottom));
    }


    /* =========================================
       EMOJI BUTTON
    ========================================= */

    .emoji-button {

      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border: 0;

      background: transparent;

      border-radius: 50%;

      font-size: 23px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      user-select: none;

      touch-action: manipulation;

      transition:
        background .15s,
        transform .1s;
    }


    .emoji-button:hover {

      background: #f0f3f5;
    }


    .emoji-button:active {

      transform: scale(.90);
    }


    /* =========================================
       INPUT WRAPPER
    ========================================= */

    .footer__input-wrap {

      flex: 1;

      min-width: 0;

      height: 44px;

      display: flex;

      align-items: center;

      background: #f1f3f5;

      border-radius: 22px;

      padding:
        0 15px;
    }


    /* =========================================
       INPUT
    ========================================= */

    input[type="text"] {

      width: 100%;

      height: 44px;

      border: 0;

      outline: 0;

      background: transparent;

      font-family: inherit;

      font-size: 15px;

      color: #17212b;

      direction: rtl;
    }


    input[type="text"]::placeholder {

      color: #8b98a2;
    }


    /* =========================================
       SEND BUTTON
    ========================================= */

    .send-btn {

      width: 46px;
      height: 46px;

      min-width: 46px;

      border: 0;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2aabee,
          #168ac1
        );

      color: white;

      font-size: 19px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 3px 8px rgba(34,158,217,.28);

      transition:
        transform .12s,
        box-shadow .12s;
    }


    .send-btn:hover {

      box-shadow:
        0 4px 12px rgba(34,158,217,.38);
    }


    .send-btn:active {

      transform:
        scale(.91);
    }


    /* =========================================
       EMOJI PANEL
    ========================================= */

    .emoji-panel {

      position: absolute;

      bottom: 69px;

      right: 8px;

      width: 300px;

      max-width: calc(100vw - 16px);

      max-height: 250px;

      overflow-y: auto;

      padding: 10px;

      display: none;

      grid-template-columns:
        repeat(8, 1fr);

      gap: 3px;

      background: #ffffff;

      border-radius: 13px;

      box-shadow:
        0 7px 30px rgba(0,0,0,.20);

      z-index: 100;
    }


    .emoji-panel.show {

      display: grid;
    }


    .emoji-choice {

      width: 32px;
      height: 32px;

      border: 0;

      background: transparent;

      border-radius: 7px;

      font-size: 21px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      transition: .1s;
    }


    .emoji-choice:hover {

      background: #eef2f4;

      transform: scale(1.12);
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      body {

        background: #dce6ed;
      }


      .content {

        width: 100vw;

        height: 100dvh;

        border-radius: 0;

        box-shadow: none;
      }


      .chat-header {

        height: 60px;

        min-height: 60px;

        padding:
          6px 7px;
      }


      .chat-header__back {

        width: 38px;
        height: 38px;
      }


      .chat-header__avatar {

        width: 42px;
        height: 42px;
      }


      .chat-header__info {

        margin-right: 7px;
      }


      .chat-header__title {

        font-size: 15px;
      }


      .chat-header__actions {

        gap: 0;
      }


      .header-action {

        width: 38px;
        height: 38px;

        font-size: 18px;
      }


      .messages {

        padding:
          10px 7px 10px;
      }


      .message {

        max-width: 86%;
      }


      .message__bubble {

        font-size: 15px;

        padding:
          8px 11px;
      }


      .footer {

        min-height: 61px;

        padding:
          6px 6px;
      }


      .emoji-button {

        width: 40px;
        height: 40px;
      }


      .footer__input-wrap {

        height: 43px;
      }


      input[type="text"] {

        height: 43px;
      }


      .send-btn {

        width: 44px;
        height: 44px;

        min-width: 44px;
      }


      .emoji-panel {

        bottom: 66px;

        right: 5px;

        width: 290px;
      }
    }


    /* =========================================
       حالة التركيز على الكتابة
    ========================================= */

    .footer__input-wrap:focus-within {

      background: #eef5f8;

      box-shadow:
        inset 0 0 0 1px
        rgba(34,158,217,.18);
    }


    /* =========================================
       تحسين اللمس
    ========================================= */

    button {

      font-family: inherit;
    }


    /* =========================================
       عندما يكون الكيبورد مفتوحًا
    ========================================= */

    @media (max-height: 500px) {

      .chat-header {

        height: 52px;

        min-height: 52px;
      }


      .chat-header__avatar {

        width: 36px;
        height: 36px;

        font-size: 18px;
      }


      .messages {

        padding-top: 6px;
      }


      .footer {

        min-height: 52px;
      }


      .footer__input-wrap {

        height: 38px;
      }


      input[type="text"] {

        height: 38px;
      }


      .send-btn {

        width: 40px;
        height: 40px;

        min-width: 40px;
      }


      .emoji-button {

        width: 38px;
        height: 38px;
      }
    }

  </style>

</head>


<body>

  <div class="app">

    <div class="content">


      <!-- =====================================
           HEADER
      ====================================== -->

      <header class="chat-header">

        <div
          class="chat-header__back"
          title="رجوع">
          ‹
        </div>


        <div
          class="chat-header__avatar">
          💬
        </div>


        <div class="chat-header__info">

          <div
            class="chat-header__title">
            محادثة خاصة
          </div>

          <div
            class="chat-header__status">
            في انتظار المستخدم الآخر...
          </div>

        </div>


        <div class="chat-header__actions">

          <button
            type="button"
            class="header-action"
            title="بحث">
            🔍
          </button>

          <button
            type="button"
            class="header-action"
            title="المزيد">
            ⋮
          </button>

        </div>

      </header>


      <!-- =====================================
           MESSAGES

           مهم:
           نفس class الذي يحتاجه script.js
      ====================================== -->

      <div class="messages">

      </div>


      <!-- =====================================
           FOOTER
      ====================================== -->

      <form
        class="footer"
        onsubmit="return false;">


        <!-- زر الإيموجي -->

        <button
          type="button"
          class="emoji-button"
          id="emojiButton"
          aria-label="Emoji">

          😊

        </button>


        <!-- input -->

        <div class="footer__input-wrap">

          <input
            type="text"
            autocomplete="off"
            placeholder="اكتب رسالة..."
          >

        </div>


        <!-- send -->

        <button
          type="submit"
          class="send-btn"
          title="إرسال">

          ➤

        </button>


        <!-- =====================================
             Emoji Panel
        ====================================== -->

        <div
          class="emoji-panel"
          id="emojiPanel">


          <button type="button" class="emoji-choice">😀</button>
          <button type="button" class="emoji-choice">😃</button>
          <button type="button" class="emoji-choice">😄</button>
          <button type="button" class="emoji-choice">😁</button>
          <button type="button" class="emoji-choice">😂</button>
          <button type="button" class="emoji-choice">🤣</button>
          <button type="button" class="emoji-choice">😊</button>
          <button type="button" class="emoji-choice">😍</button>

          <button type="button" class="emoji-choice">🥰</button>
          <button type="button" class="emoji-choice">😘</button>
          <button type="button" class="emoji-choice">😎</button>
          <button type="button" class="emoji-choice">🤩</button>
          <button type="button" class="emoji-choice">🥳</button>
          <button type="button" class="emoji-choice">😇</button>
          <button type="button" class="emoji-choice">🤔</button>
          <button type="button" class="emoji-choice">😴</button>

          <button type="button" class="emoji-choice">😭</button>
          <button type="button" class="emoji-choice">😢</button>
          <button type="button" class="emoji-choice">😡</button>
          <button type="button" class="emoji-choice">😱</button>
          <button type="button" class="emoji-choice">🙄</button>
          <button type="button" class="emoji-choice">😏</button>
          <button type="button" class="emoji-choice">🤗</button>
          <button type="button" class="emoji-choice">🤭</button>

          <button type="button" class="emoji-choice">❤️</button>
          <button type="button" class="emoji-choice">🧡</button>
          <button type="button" class="emoji-choice">💛</button>
          <button type="button" class="emoji-choice">💚</button>
          <button type="button" class="emoji-choice">💙</button>
          <button type="button" class="emoji-choice">💜</button>
          <button type="button" class="emoji-choice">🖤</button>
          <button type="button" class="emoji-choice">🤍</button>

          <button type="button" class="emoji-choice">👍</button>
          <button type="button" class="emoji-choice">👎</button>
          <button type="button" class="emoji-choice">👏</button>
          <button type="button" class="emoji-choice">🙏</button>
          <button type="button" class="emoji-choice">🔥</button>
          <button type="button" class="emoji-choice">💯</button>
          <button type="button" class="emoji-choice">✨</button>
          <button type="button" class="emoji-choice">🎉</button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================
       TEMPLATE

       مهم جدًا:
       مطابق تمامًا لـ script.js الأصلي
  ====================================== -->

  <template data-template="message">

    <div class="message">

      <div class="message__name"></div>

      <div class="message__bubble"></div>

    </div>

  </template>


  <!-- =====================================
       SCRIPT الأصلي
  ====================================== -->

  <script src="script.js"></script>


  <!-- =====================================
       وظائف الواجهة فقط
       لا علاقة لها بـ WebRTC
  ====================================== -->

  <script>

    const emojiButton =
      document.getElementById('emojiButton');

    const emojiPanel =
      document.getElementById('emojiPanel');

    const messageInput =
      document.querySelector(
        'input[type="text"]'
      );


    /* =====================================
       الضغطة العادية
       تضع 😊 في الرسالة
    ====================================== */

    let longPress = false;

    let pressTimer = null;


    emojiButton.addEventListener(
      'click',
      function () {

        /*
          إذا كانت ضغطة مطولة،
          لا ننفذ الضغطة العادية.
        */

        if (longPress) {

          longPress = false;

          return;
        }


        messageInput.value +=
          '😊';

        messageInput.focus();

      }
    );


    /* =====================================
       بداية الضغط
    ====================================== */

    function startLongPress() {

      longPress = false;


      pressTimer =
        setTimeout(
          function () {

            longPress = true;

            emojiPanel.classList.toggle(
              'show'
            );

          },
          500
        );
    }


    /* =====================================
       إلغاء الضغط
    ====================================== */

    function cancelLongPress() {

      if (pressTimer) {

        clearTimeout(
          pressTimer
        );

        pressTimer = null;
      }
    }


    emojiButton.addEventListener(
      'mousedown',
      startLongPress
    );


    emojiButton.addEventListener(
      'mouseup',
      cancelLongPress
    );


    emojiButton.addEventListener(
      'mouseleave',
      cancelLongPress
    );


    emojiButton.addEventListener(
      'touchstart',
      startLongPress,
      { passive: true }
    );


    emojiButton.addEventListener(
      'touchend',
      cancelLongPress
    );


    /* =====================================
       اختيار Emoji
    ====================================== */

    document
      .querySelectorAll('.emoji-choice')
      .forEach(
        button => {

          button.addEventListener(
            'click',
            function () {

              messageInput.value +=
                this.innerText;

              messageInput.focus();

              emojiPanel.classList.remove(
                'show'
              );

            }
          );

        }
      );


    /* =====================================
       الضغط خارج لوحة الإيموجي
    ====================================== */

    document.addEventListener(
      'click',
      function (event) {

        if (
          !emojiPanel.contains(
            event.target
          ) &&
          event.target !== emojiButton
        ) {

          emojiPanel.classList.remove(
            'show'
          );

        }

      }
    );


    /* =====================================
       Scroll عند فتح الكيبورد
    ====================================== */

    messageInput.addEventListener(
      'focus',
      function () {

        setTimeout(
          function () {

            const messages =
              document.querySelector(
                '.messages'
              );

            messages.scrollTop =
              messages.scrollHeight;

          },
          150
        );

      }
    );


    /* =====================================
       عند تغيير حجم الشاشة
    ====================================== */

    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        'resize',
        function () {

          setTimeout(
            function () {

              const messages =
                document.querySelector(
                  '.messages'
                );

              messages.scrollTop =
                messages.scrollHeight;

            },
            100
          );

        }
      );

    }

  </script>

</body>

</html>
